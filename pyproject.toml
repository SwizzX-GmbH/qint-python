[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qint"
version = "0.1.0"
description = "Official Python SDK for the Qint merchant payments API"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "SwizzX GmbH", email = "dev@qint.ch" }]
keywords = ["qint", "payments", "crypto", "checkout", "webhooks", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://qint.ch"
Documentation = "https://docs.qint.ch"
Repository = "https://github.com/SwizzX-GmbH/qint-python"
Issues = "https://github.com/SwizzX-GmbH/qint-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
